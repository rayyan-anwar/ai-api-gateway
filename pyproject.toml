[project]
name = "ai-api-gateway"
version = "0.1.0"
description = "Routing, fallback, timeouts, rate limiting, auth, health checks and usage metrics in front of AI providers."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rayyan Anwar" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1", "pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E702", "E701"]

[tool.pytest.ini_options]
testpaths = ["tests"]
